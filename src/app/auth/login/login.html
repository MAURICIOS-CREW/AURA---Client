<div class="login-wrapper">
  <div class="login-content">
    
    <div class="login-header">
      <div class="header-title">
        <img src="/logo_aura.png" alt="Logo de AURA" class="logo-login">
        <h3>¡Bienvenido Administrador!</h3>
      </div>
    </div>

    <div class="login-body">
      <p class="login-desc">Simplifica la gestión de tu sector con una plataforma impulsada por inteligencia artificial.</p>
      
      <form
        class="login-form"
        [formGroup]="loginForm"
        (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label for="login">
            <span class="material-symbols-outlined">mail</span>
            Usuario o Correo Electrónico
          </label>

          <input
            type="text"
            id="login"
            class="aura-input"
            placeholder="Usuario o correo electrónico"
            formControlName="login"
            [attr.disabled]="isSubmitting() ? true : null">
        </div>

        <div class="form-group">
          <label for="password">
            <span class="material-symbols-outlined">lock</span>
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            class="aura-input"
            placeholder="••••••••"
            formControlName="password"
            [attr.disabled]="isSubmitting() ? true : null">
        </div>

        @if (errorMessage) {
          <div class="login-error aura-row-enter">
            <span class="material-symbols-outlined">error</span>
            {{ errorMessage }}
          </div>
        }

        <button
          type="submit"
          class="btn-action vehicle login-btn"
          [disabled]="loginForm.invalid || isSubmitting()">

          @if (isSubmitting()) {
            <app-spinner variant="light" />
            Iniciando sesión...
          } @else {
            <span class="material-symbols-outlined">login</span>
            Iniciar Sesión
          }

        </button>

      </form>
    </div>
    
  </div>
</div>
