<div class="login-wrapper">
  <div class="login-content">
    
    <div class="login-header">
      <div class="header-title">
        <img src="/logo_aura.png" alt="Logo de AURA" class="logo-login">
        <h3>¡Bienvenido Administrador!</h3>
      </div>
    </div>

    <div class="login-body">
      <p class="login-desc">Simplifica la gestión de tu sector con una plataforma impulsada por inteligencia artificial.</p>
      
      <form class="login-form">
        <div class="form-group">
          <label for="email">
            <span class="material-symbols-outlined">mail</span> Correo Electrónico
          </label>
          <input type="email" id="email" class="aura-input" placeholder="admin@aura.com" required>
        </div>

        <div class="form-group">
          <label for="password">
            <span class="material-symbols-outlined">lock</span> Contraseña
          </label>
          <input type="password" id="password" class="aura-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-action vehicle login-btn">
          <span class="material-symbols-outlined">login</span> Iniciar Sesión
        </button>
      </form>
    </div>
    
  </div>
</div>
